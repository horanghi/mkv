<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>마령촌 · GRIMHOLLOW</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }
      /* 정수 배율 업스케일. 보간이 들어가면 픽셀아트가 뭉갠다. */
      #app canvas {
        image-rendering: pixelated;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
